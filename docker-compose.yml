# Backend stack: Strapi + PostgreSQL. For the full stack run `docker compose up` in `therecom/`.
services:
  cms:
    build: .
    image: novaline-be:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_CLIENT: postgres
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${DATABASE_NAME:-novaline}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-novaline}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-novaline}
    volumes:
      - uploads:/opt/app/public/uploads
    ports:
      - "1337:1337"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 1g

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-novaline}
      POSTGRES_USER: ${DATABASE_USERNAME:-novaline}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-novaline}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
  uploads:
