# NovaLine on a shared HestiaCP server: PostgreSQL + Strapi + Nuxt from prebuilt images.
# Containers publish ports on 127.0.0.1 only; Hestia's nginx proxies the domain to them
# (templates novaline-docker.tpl/.stpl). Nothing is reachable from the internet directly.
#
#   cd /opt/novaline && docker compose pull && docker compose up -d
name: novaline

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-novaline}
      POSTGRES_USER: ${DATABASE_USERNAME:-novaline}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 384m

  cms:
    image: ${CMS_IMAGE:-ghcr.io/screamodev/novaline-be:latest}
    restart: unless-stopped
    env_file: cms.env
    environment:
      NODE_ENV: production
      DATABASE_CLIENT: postgres
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${DATABASE_NAME:-novaline}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-novaline}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      PUBLIC_URL: https://${DOMAIN}/cms
      IS_PROXIED: "true"
      FRONTEND_URL: http://web:3000
    volumes:
      - uploads:/opt/app/public/uploads
    ports:
      - "127.0.0.1:${CMS_PORT:-3101}:1337"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:1337/_health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 10
    mem_limit: 768m

  web:
    image: ${WEB_IMAGE:-ghcr.io/screamodev/novaline-fe:latest}
    restart: unless-stopped
    env_file: web.env
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=384
      NUXT_STRAPI_URL: http://cms:1337
      NUXT_PUBLIC_SITE_URL: https://${DOMAIN}
      NUXT_SITE_URL: https://${DOMAIN}
      NUXT_PUBLIC_I18N_BASE_URL: https://${DOMAIN}
      NUXT_SITE_ENV: ${SITE_ENV:-staging}
    ports:
      - "127.0.0.1:${WEB_PORT:-3100}:3000"
    depends_on:
      cms:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/robots.txt || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    mem_limit: 512m

volumes:
  db-data:
  uploads:
