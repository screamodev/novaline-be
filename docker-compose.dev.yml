# Dev stack: Strapi in develop mode (hot reload, content-type builder) + PostgreSQL.
#   docker compose -f docker-compose.dev.yml up
services:
  cms:
    image: node:22-alpine
    working_dir: /opt/app
    command: sh -c "apk add --no-cache vips-dev >/dev/null && npm install --no-audit --no-fund && npm run develop"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      DATABASE_CLIENT: postgres
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${DATABASE_NAME:-novaline}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-novaline}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-novaline}
      FRONTEND_URL: http://web:3000
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/opt/app
      - cms_node_modules:/opt/app/node_modules
      - cms_tmp:/opt/app/.tmp
      - cms_dist:/opt/app/dist
      - cms_strapi:/opt/app/.strapi
    ports:
      - "1337:1337"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-novaline}
      POSTGRES_USER: ${DATABASE_USERNAME:-novaline}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-novaline}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
  cms_node_modules:
  cms_tmp:
  cms_dist:
  cms_strapi:
